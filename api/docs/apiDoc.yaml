openapi: 3.0.0
info:
  title: UrbanFlow API
  description: Docs ufficiali per le API utilizzati nel progetto UrbanFlow.
  version: 0.0.1
servers:
  - url: http://api.example.com/v1
    description: Optional server description, e.g. Main (production) server
  - url: http://staging-api.example.com
    description: Optional server description, e.g. Internal staging server for testing
tags:
  - name: User
    description: Endpoints relativi a un oggetto utente.
  - name: Event
    description: Endpoints relativi a un oggetto evento.
  - name: Zone
    description: Endpoints relativi a un oggetto zona.

# per i JWT come facciamo? ALV: Boh non so cosa siano
paths:
  /users:
    get:
      tags:
        - User
      summary: Restituisce la lista degli utenti.
      description: Restituisce la lista degli utenti presenti sulla piattaforma.
      parameters:
        - name: role
          in: query
          required: false
          description: Ruolo degli utenti da cercare, se non specificato restituisce tutti gli utenti.
          schema:
            type: string
            enum:
              - admin
              - base
      responses:
        200: # success
          description: Risorsa JSON contenente lista degli utenti.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/user"
        400: # bad request
          description: Richiesta non valida.
        401: #unauthorized
          description: Accesso non autorizzato alla risorsa.
    post:
      tags:
        - User
      summary: Crea un nuovo utente.
      description: Aggiunge un nuovo utente al database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        201: # resp: utente creato
          description: Utente creato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        400: # bad request
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrizione dell'errore.
                    example: Il campo 'name' è richiesto.
        401: # unauthorized
          description: Accesso non autorizzato alla risorsa.
  /users/{id}:
    get:
      tags:
        - User
      summary: Restituisce utente specifico.
      parameters:
        - name: id
          in: path
          description: id dell'utente da restituire
          schema:
            type: integer
          required: true
      responses:
        200: # success
          description: Informazioni dell'evento restitutite con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        400: #bad request
          description: Richiesta non valida.
        401: #unauthorized
          description: Accesso non autorizzato alla risorsa.
        404: # not found
          description: Evento non trovato.
    put:
      tags:
        - User
      summary: Aggiorna un utente esistente.
      description: Aggiorna i dettagli dell'utente dato il suo ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'utente da aggiornare.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        200: # success
          description: Utente aggiornato con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        400: # bad request
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Dettagli sull'errore riscontrato.
                    example: Gli schemi delle risorse non coincidono.
        401: # unauthorized
          description: Accesso non autorizzato alla risorsa.
        404: # not found
          description: Utente non trovato.
    delete:
      tags:
        - User
      summary: Elimina un utente esistente.
      description: Rimuove un utente dato il suo ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'utente da eliminare.
          schema:
            type: integer
      responses:
        204: # No Content
          description: Utente eliminato con successo.
        400: # bad request
          description: Richiesta non valida.
        401: # unauthorized
          description: Accesso non autorizzato alla risorsa.
        404: # not found
          description: Utente non trovato.
  /events:
    get:
      tags:
        - Event
      summary: Restituisce la lista degli eventi.
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: local_date
            example: "2024-08-17T14:07:30"
          required: false
        - in: query
          name: endDate
          schema:
            type: string
            format: local_date
            example: "2024-08-17T14:07:30"
          required: false
      responses:
        200: #success
          description: Risorsa JSON contenente lista di eventi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/zone"
        400: # bad request
          description: Richiesta non valida.
        401: #unauthorized
          description: Accesso non autorizzato alla risorsa.
    post:
      tags:
        - Event
      summary: Crea un nuovo evento.
      description: Aggiunge un nuovo evento al database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/event"
      responses:
        201: # resp: evento creato
          description: Evento creato con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/event"
        400: # bad request
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrizione dell'errore.
                    example: "Il campo 'name' è richiesto."
        401: # unauthorized
          description: Accesso non autorizzato alla risorsa.
  /events/{id}:
    get:
      tags:
        - Event
      summary: Restituisce un evento specifico.
      description: Ottiene i dettagli di un singolo evento dato il suo ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'evento da cercare.
          schema:
            type: string
      responses:
        200:
          description: Informazioni dell'evento restituite con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/event"
        400: #bad request
          description: Richiesta non valida.
        401: #unauthorized
          description: Accesso non autorizzato alla risorsa.
        404: # not found
          description: Evento non trovato.
    put:
      tags:
        - Event
      summary: Aggiorna un evento esistente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/event"
      responses:
        "200":
          description: Evento aggiornato con successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/event"
        "400":
          description: Richiesta non valida
        "404":
          description: Evento non trovato

    delete:
      tags:
        - Event
      summary: Elimina un evento esistente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Evento eliminato con successo
        "400":
          description: Richiesta non valida
        "404":
          description: Evento non trovato
  /zones:
    get:
      tags:
        - Zone
      summary: Restituisce la lista delle zone.
      description: Ottiene un elenco di tutte le zone disponibili.
      responses:
        200:
          description: Risorsa JSON contenente lista di zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/zone"
        400: #bad request
          description: Richiesta non valida.
        401: #unauthorized
          description: Accesso non autorizzato alla risorsa.
  /zones/{id}:
    get:
      tags:
        - Zone
      summary: Restituisce una zona esistente.
      description: Ottiene i dettagli di una singola zona dato il suo ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID della zona da cercare.
          schema:
            type: string
      responses:
        200:
          description: Informazioni della zona restituite con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/zone"
        400: #bad request
          description: Richiesta non valida.
        401: #unauthorized
          description: Accesso non autorizzato alla risorsa.
        404: # not found
          description: Zona non trovata.
    put:
      tags:
        - Zone
      summary: Aggiorna una zona esistente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/zone"
      responses:
        "200":
          description: Zona aggiornata con successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/zone"
        "400":
          description: Richiesta non valida
        "404":
          description: Zona non trovata
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Effettua l'accesso
      description: Fornendo email e password corretti viene restituito un token di sessione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth"
      responses:
        200: # success
          description: login effettutato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/authResponse"
        400: # bad request
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrizione dell'errore.
                    example: Formato del campo 'email' non valido.
        401: # unauthorized
          description: Non autorizzato.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrizione dell'errore.
                    example: Credeniziali non valide
        # 500
components:
  schemas:
    user:
      type: object
      required:
        - id
        - name
        - surname
        - email
        - role
      properties:
        id:
          type: integer
          description: Numero identificativo dell'utente.
          example: 896544
          readOnly: true
        name:
          type: string
          description: Nome dell'utente.
          example: Mario
        surname:
          type: string
          description: Cognome dell'utente.
          example: Rossi
        email:
          type: string
          description: Email istituzionale dell'utente.
          example: mario.rossi@domain.it
        role:
          type: string
          enum:
            - admin
            - base
          description: Ruolo dell'utente nella piattaforma.
          example: admin
    event:
      type: object
      required:
        - id
        - title
        - startDate
        - endDate
      properties:
        id:
          type: integer
          description: Codice identificativo evento.
          example: 10332
          readOnly: true
        title:
          type: string
          description: Titolo dell'evento registrato.
          example: "Festival dell'economia"
        startDate:
          type: string
          format: date-time
          description: Data di inizio dell'evento (oggetto data convertito in stringa).
        endDate:
          type: string
          format: date-time
          description: Data di fine dell'evento (oggetto data convertito in stringa).
        zones:
          type: array
          description: Array di interi, sono gli id delle zone in cui l'evento ha luogo.
          items:
            type: integer
          example: [1, 2]
    zone:
      type: object
      required:
        - id
        - name
        - pivots
        - threshold
      properties:
        id:
          type: string
          description: Identificativo della zona.
          readOnly: true
        name:
          type: string
          description: Nome della zona.
          readOnly: true
        coordinates:
          type: array
          description: Array di coppie latitudine-longitudine per identificare i vertici del poligono rappresentante una zona.
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          readOnly: true
        latestData:
          type: object
          properties:
            density:
              type: number
              description: Densità registrata nella zona.
            date:
              type: string
              format: date-time
              description: Data dell'ultima rilevazione.
          readOnly: true
        threshold:
          type: integer
          default: 0
          example: 250
          description: Limite oltre il quale segnalare un'affluenza impevista. Se 0, significa che non c'è nessun limite.
    auth:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@email.com
        password:
          type: string
          example: very_safe_password
    authResponse:
      type: object
      properties:
        JWT:
          type: string
          example: 7WK5T79u5mIzjIXXi2oI9Fglmgivv7RAJ7izyj9tUyQ
      # penso che abbia senso inserire solo il jwt in questo caso no?
