openapi: 3.0.0
info:
  title: UrbanFlow API
  description: Docs ufficiali per le API utilizzati nel progetto UrbanFlow.
  version: 0.0.1
servers:
  - url: http://api.urbanflow.it/v1
    description: Server di produzione.
  - url: http://localhost:3000/v1
    description: Server di staging per test.
tags:
  - name: User
    description: Endpoints relativi a un oggetto utente.
  - name: Event
    description: Endpoints relativi a un oggetto evento.
  - name: Zone
    description: Endpoints relativi a un oggetto zona.
  - name: Session
    description: Endpoints relativi alla gestione delle sessioni.
paths:
  /users:
    get:
      tags:
        - User
      summary: Restituisce la lista degli utenti.
      description: Restituisce la lista degli utenti presenti sulla piattaforma.
      security:
        - authToken: []
      parameters:
        - name: role
          in: query
          required: false
          description: Ruolo degli utenti da cercare, se non specificato restituisce tutti gli utenti.
          schema:
            type: string
            enum:
              - admin
              - base
      responses:
        200:
          description: Risorsa JSON contenente lista degli utenti.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/user"
        400:
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: Non autenticato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        403:
          description: Accesso non autorizzato alla risorsa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        500:
          description: Errore interno al server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      tags:
        - User
      summary: Crea un nuovo utente.
      description: Aggiunge un nuovo utente al database.
      security:
        - authToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        201:
          description: Utente creato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        400:
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: Non autenticato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        403:
          description: Accesso non autorizzato alla risorsa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        500:
          description: Errore interno al server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /users/{id}:
    get:
      tags:
        - User
      summary: Restituisce utente specifico.
      description: Ottiene i dettagli di un singolo utente dato il suo ID.
      security:
        - authToken: []
      parameters:
        - name: id
          in: path
          description: id dell'utente da restituire
          schema:
            type: integer
          required: true
      responses:
        200:
          description: Informazioni dell'evento restitutite con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        400:
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: Non autenticato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        403:
          description: Accesso non autorizzato alla risorsa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        404:
          description: Evento non trovato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        500:
          description: Errore interno al server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    put:
      tags:
        - User
      summary: Aggiorna un utente esistente.
      description: Aggiorna i dettagli dell'utente dato il suo ID.
      security:
        - authToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'utente da aggiornare.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/userUpdate"
      responses:
        200:
          description: Utente aggiornato con successo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        400:
          description: Richiesta non valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: Non autenticato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        403:
          description: Accesso non autorizzato alla risorsa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        404:
          description: Utente non trovato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        500:
          description: Errore interno al server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      tags:
        - User
      summary: Elimina un utente esistente.
      description: Rimuove un utente dato il suo ID.
      security:
        - authToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID dell'utente da eliminare.
          schema:
            type: integer
      responses:
        204:
          description: Utente eliminato con successo.
        400:
          description: Richiesta non valida.
        401:
          description: Non autenticato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        403:
          description: Accesso non autorizzato alla risorsa.
        404:
          description: Utente non trovato.
        500:
          description: Errore interno al server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
