components:
  securitySchemes:
    authToken:
      type: http
      scheme: bearer
      description: Token per autenticazione JWT
  schemas:
    user:
      type: object
      required:
        - _id
        - name
        - surname
        - email
        - role
      properties:
        _id:
          type: string
          description: Numero identificativo dell'utente.
          example: "60d0fe4f5311236168a109ca"
          readOnly: true
        name:
          type: string
          description: Nome dell'utente.
          example: Mario
        surname:
          type: string
          description: Cognome dell'utente.
          example: Rossi
        email:
          type: string
          description: Email istituzionale dell'utente.
          example: mario.rossi@domain.it
        role:
          type: string
          enum:
            - admin
            - base
          description: Ruolo dell'utente nella piattaforma.
          example: admin
    event:
      type: object
      required:
        - _id
        - title
        - startDate
        - endDate
      properties:
        _id:
          type: string
          description: Codice identificativo evento.
          example: "60d0fe4f5311236168a109cb"
          readOnly: true
        title:
          type: string
          description: Titolo dell'evento registrato.
          example: "Festival dell'economia"
        startDate:
          type: string
          format: date-time
          description: Data di inizio dell'evento (oggetto data convertito in stringa).
          example: "2024-08-17T14:07:30"
        endDate:
          type: string
          format: date-time
          description: Data di fine dell'evento (oggetto data convertito in stringa).
          example: "2024-08-18T14:07:30"
        zones:
          type: array
          description: Array di interi, sono gli id delle zone in cui l'evento ha luogo.
          items:
            type: integer
          example: [1, 2]
    zone:
      type: object
      required:
        - _id
        - name
        - coordinates
        - threshold
      properties:
        _id:
          type: string
          description: Identificativo della zona.
          example: "60d0fe4f5311236168a109cc"
          readOnly: true
        name:
          type: string
          description: Nome della zona.
          example: "Piazza Duomo"
          readOnly: true
        coordinates:
          type: array
          description: Array di coppie latitudine-longitudine per identificare i vertici del poligono rappresentante una zona.
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          example:
            [
              [45.46427, 9.18951],
              [45.46427, 9.19051],
              [45.46527, 9.19051],
              [45.46527, 9.18951],
            ]
          readOnly: true
        threshold:
          type: integer
          default: 0
          example: 250
          description: Limite oltre il quale segnalare un'affluenza imprevista. Se 0, significa che non c'è nessun limite.

    cameraData:
      type: object
      required:
        - zone
        - density
        - date
      properties:
        zone:
          type: number
          description: ID della zona
          example: 3
        density:
          type: number
          description: Densità registrata nella zona.
          example: 120
        date:
          type: string
          format: date-time
          description: Data dell'ultima rilevazione.
          example: "2024-08-17T14:07:30"

    auth:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@domain.it
        password:
          type: string
          example: "MarioRossi123"
    authResponse:
      type: object
      properties:
        JWT:
          type: string
          example: 7WK5T79u5mIzjIXXi2oI9Fglmgivv7RAJ7izyj9tUyQ
    error:
      type: object
      properties:
        error:
          type: string
          example: Errore!
          description: Descrizione dell'errore
    userUpdate:
      type: object
      required:
        - _id
        - name
        - surname
        - email
        - role
        - password
      properties:
        _id:
          type: string
          description: Numero identificativo dell'utente.
          example: "60d0fe4f5311236168a109ca"
          readOnly: true
        name:
          type: string
          description: Nome dell'utente.
          example: Mario
        surname:
          type: string
          description: Cognome dell'utente.
          example: Rossi
        email:
          type: string
          description: Email istituzionale dell'utente.
          example: mario.rossi@domain.it
        role:
          type: string
          enum:
            - admin
            - base
          description: Ruolo dell'utente nella piattaforma.
          example: admin
        password:
          type: string
          description: Password dell'utente.
          example: "MarioRossi123"
