name: UrbanFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm --prefix api ci

      - name: Run Jest test suite
        run: npm --prefix api test
        env:
          PORT: 3000
          # Test-only fixture secret — the suite runs against an in-memory Mongo.
          SUPER_SECRET: test_jwt_super_secret_for_ci_pipeline_2025
          JWT_SECRET: test_jwt_super_secret_for_ci_pipeline_2025

  build-frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm --prefix frontend ci

      - name: Build Vue SPA
        run: npm --prefix frontend run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: "${{ secrets.VITE_API_URL || vars.VITE_API_URL || 'https://ab-urbanflow.duckdns.org' }}"
