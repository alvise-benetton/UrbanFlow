name: UrbanFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm --prefix api ci

      - name: Run Jest test suite
        run: npm --prefix api test
        env:
          PORT: 3000
          SUPER_SECRET: test_jwt_super_secret_for_ci_pipeline_2025
          JWT_SECRET: test_jwt_super_secret_for_ci_pipeline_2025

  build-frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm --prefix frontend ci

      - name: Build Vue SPA
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: http://localhost:3000

  deploy-oracle:
    name: Deploy to Oracle Server
    needs: [test-api, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        if: env.SSH_KEY != ''
        with:
          host: ${{ secrets.ORACLE_HOST || '130.162.248.23' }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script: |
            cd /home/ubuntu/UrbanFlow
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
