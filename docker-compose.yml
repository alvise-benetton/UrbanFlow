services:
  mongodb:
    image: mongo:7.0
    container_name: urbanflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-urbanflow_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-36a8f7b2c9129c99019565917d12acb1}
      - MONGO_INITDB_DATABASE=urbanflow
    volumes:
      - ${MONGO_DATA_DIR:-/opt/urbanflow/mongo-data}:/data/db
    networks:
      - default

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: urbanflow-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_URL=${DB_URL:-mongodb://urbanflow_admin:36a8f7b2c9129c99019565917d12acb1@mongodb:27017/urbanflow?authSource=admin}
      - SUPER_SECRET=${SUPER_SECRET:-urbanflow_super_secret_jwt_key_2025_prod_secure}
      - JWT_SECRET=${JWT_SECRET:-urbanflow_super_secret_jwt_key_2025_prod_secure}
    depends_on:
      - mongodb
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BASE_PATH=/
        - VITE_API_URL=
    container_name: urbanflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - default

volumes:
  mongo-data:
    driver: local

networks:
  default:
    name: urbanflow_default
